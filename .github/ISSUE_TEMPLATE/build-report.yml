name: Rapport de fabrication et essais
description: Documenter une carte et ses mesures avec une révision identifiable.
title: "[Fabrication] "
body:
  - type: textarea
    id: revision
    attributes:
      label: Révision et matériel
      description: Commit, PCB, fabricant, cuivre par couche, empilage, modules et révisions, noyau, substitutions.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Configuration et corrections appliquées
      description: Fréquence DC-DC, valeurs L/C, cavaliers EGS005Q, protections, corrections matérielles et rapports ERC/DRC.
    validations:
      required: true
  - type: textarea
    id: measurements
    attributes:
      label: Conditions et mesures
      description: Source DC, limite de courant, charge, durée, ambiante, refroidissement, instruments, courants, tensions, puissances, températures et captures.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Résultats et limites
      description: Ce qui fonctionne, ce qui échoue, essais non réalisés et points restant à valider.
    validations:
      required: true
